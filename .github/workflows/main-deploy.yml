name: Production Deploy

# Runs on pushes to main branch
# Includes quality checks, build, and production deployment to Cloudflare Pages
on:
  push:
    branches:
      - main

# Prevent concurrent production deployments
concurrency:
  group: production-deploy
  cancel-in-progress: false

# Grant necessary permissions
permissions:
  contents: read
  deployments: write
  statuses: write

jobs:
  # Single job: build + deploy in one runner.
  #
  # Previously this was a build job that uploaded an ~880 MB artifact and a
  # separate deploy job that downloaded it. That artifact counted against the
  # 2 GB Actions storage cap on every push to main. Merging the two jobs lets
  # the deploy reuse the build output in-place (dist/) with nothing persisted to
  # Actions storage. The build step still runs before the deploy step, so a
  # broken build fails the job before anything is deployed — "build gates
  # deploy" is preserved.
  build-and-deploy:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          lfs: false

      - name: Build zfb application
        uses: ./.github/actions/build-zfb
        with:
          node-version: '22'

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: ./.github/actions/deploy-cloudflare
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          branch: main
          commit-hash: ${{ github.sha }}
          commit-message: 'Production deploy: ${{ github.sha }}'
          build-dir: dist

      - name: Create deployment record
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy-url }}
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              description: 'Production deployment to Cloudflare Pages',
              production_environment: true,
              auto_merge: false,
              required_contexts: []
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: process.env.DEPLOY_URL,
              description: 'Deployment successful'
            });

      - name: Notify deployment status
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy-url }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === 'success';
            const status = success ? 'success' : 'failure';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: status,
              target_url: process.env.DEPLOY_URL,
              description: success ? 'Production deployment successful' : 'Production deployment failed',
              context: 'cloudflare/production'
            });
