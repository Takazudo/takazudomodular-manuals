# Production deployment workflow for the zmanuals site.
#
# Triggered on every push to `main`. The pipeline:
#   1. Builds the zfb static site (via build-zfb composite action)
#   2. Writes dist/.assetsignore to exclude worker bundle files from public assets
#   3. Deploys to Cloudflare Workers (wrangler deploy, pinned version)
#   4. Records a GitHub deployment status
#
# Inter-job data sharing uses actions/cache (not upload-artifact) to avoid
# Actions storage accumulation. Cache keys are scoped to github.run_id so
# each run gets a fresh, unique cache that won't be reused by other runs.
#
# Concurrency: only one production deploy runs at a time.
# We do NOT cancel in-progress runs -- the earlier deploy should finish.
#
# Secrets:
#   CLOUDFLARE_API_TOKEN  -- Workers: Edit scope required (NOT Pages: Edit)
#   CLOUDFLARE_ACCOUNT_ID

name: Production Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  statuses: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build the zfb site
  # ---------------------------------------------------------------------------
  build-site:
    name: Build Site
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          lfs: false

      - name: Build zfb application
        uses: ./.github/actions/build-zfb
        with:
          node-version: '22'

      - name: Cache site build output
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/
          key: dist-${{ github.run_id }}

  # ---------------------------------------------------------------------------
  # Job 2: Deploy to Cloudflare Workers (production)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Cloudflare Workers
    needs: [build-site]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Restore site build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/
          key: dist-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Prepare dist for deployment
        run: |
          # Exclude _worker.js and _zfb_inner.mjs from the public asset directory
          # so they are not served as downloadable files (wrangler.toml documents this).
          printf '%s\n' '_worker.js' '_zfb_inner.mjs' > dist/.assetsignore

      - name: Deploy to Cloudflare Workers (production)
        # No node_modules in this job (dist-cache restore only) -- npx, but
        # pinned to the package.json devDependency version so production
        # deploys use the wrangler the check:wrangler-pin gate validates.
        run: |
          WRANGLER_VERSION=$(node -p "require('./package.json').devDependencies.wrangler")
          npx "wrangler@${WRANGLER_VERSION}" deploy
        env:
          # CLOUDFLARE_API_TOKEN requires Workers: Edit scope (NOT Pages: Edit)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record deployment status
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === 'success';
            const status = success ? 'success' : 'failure';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: status,
              description: success ? 'Production deployment successful' : 'Production deployment failed',
              context: 'cloudflare/production'
            });
