name: PR Quality Checks

# Runs on all pull requests
# - Basic quality checks (typecheck, lint, format) for all PRs
# - E2E smoke tests for PRs from preview/* branches
on:
  pull_request:
    types: [opened, synchronize, reopened]

# Prevent concurrent checks per PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Grant necessary permissions
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # Job 1: Code Quality Checks (runs for all PRs)
  quality-checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          lfs: false

      - name: Setup pnpm
        uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard against stale generated registry
        run: |
          echo "🔍 Checking lib/zfb-registry.generated.ts is in sync with public/*/data..."
          # Regenerate from public/*/data, then normalize with the repo's own
          # prettier before diffing. The raw generator output is babel-ts/
          # node-version sensitive, so a naive byte diff goes flaky-red on the
          # runner; running prettier (same version as the format check that already
          # passes for the committed file) cancels formatting differences, leaving
          # only real content drift to fail the step.
          pnpm run gen:registry
          pnpm exec prettier --write lib/zfb-registry.generated.ts
          if ! git diff --quiet -- lib/zfb-registry.generated.ts; then
            echo "::error file=lib/zfb-registry.generated.ts::Generated registry is stale. Run 'pnpm run gen:registry' and commit the result."
            echo "❌ lib/zfb-registry.generated.ts is out of sync with public/*/data."
            echo "   A manual was likely added/removed (or scripts/gen-registry.js changed) without regenerating."
            echo "   Fix: run 'pnpm run gen:registry' locally and commit the updated file."
            echo "--- drift (committed vs. freshly generated) ---"
            git --no-pager diff -- lib/zfb-registry.generated.ts
            exit 1
          fi
          echo "✅ Generated registry is in sync"

      - name: Run TypeScript type checking
        run: |
          echo "🔍 Running TypeScript type checking..."
          pnpm run typecheck
          echo "✅ Type checking passed"

      - name: Run ESLint
        run: |
          echo "🔍 Running ESLint..."
          pnpm run lint
          echo "✅ Linting passed"

      - name: Run Prettier format check
        run: |
          echo "🔍 Running Prettier format check..."
          pnpm run format
          echo "✅ Format check passed"

      - name: Run unit tests
        run: |
          echo "Running unit tests..."
          pnpm run test:unit
          echo "Unit tests passed"

      - name: Comment quality check status
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            const emoji = success ? '✅' : '❌';
            const status = success ? 'passed' : 'failed';

            const body = `${emoji} **Code Quality Checks ${status}**

            - TypeScript: ${success ? '✅' : '❌'}
            - ESLint: ${success ? '✅' : '❌'}
            - Prettier: ${success ? '✅' : '❌'}
            - Unit Tests: ${success ? '✅' : '❌'}

            ${success ? '' : '⚠️ Please fix the issues above before merging.'}`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Code Quality Checks')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

  # Job 2: Build Check (runs for all PRs)
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          lfs: false

      # Build (setup pnpm/node, install, build, verify output) via the shared
      # composite action — same action preview-deploy and main-deploy use, so
      # all paths build identically and the verify step can't drift.
      - name: Build zfb application
        uses: ./.github/actions/build-zfb
        with:
          node-version: '22'

      # Only persist the ~880 MB build artifact where it is actually consumed:
      # the page-smoke-crawler job runs on preview/* branches ONLY. On every other
      # PR the artifact would be uploaded, count against the 2 GB Actions storage
      # cap, and never be downloaded. preview-deploy now builds the site itself
      # instead of consuming this artifact, so this upload is preview/* only.
      # This workflow only triggers on pull_request, so github.head_ref is always
      # defined here (no push-event guard needed).
      - name: Upload build artifacts (for e2e tests)
        if: startsWith(github.head_ref, 'preview/')
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: zfb-build-pr-${{ github.event.pull_request.number }}
          path: dist/
          include-hidden-files: true
          retention-days: 1

  # Job 3: Page Smoke Crawler (only for preview/* branches)
  #
  # NOT Playwright — this runs scripts/test-all-pages-fast.js, a plain HTTP-status
  # crawler that GETs every /manuals/<id>/page/<n> route of every manual and
  # asserts HTTP 200. Browser-level interaction is covered separately by the
  # e2e-interaction job (Playwright) and the main-e2e workflow.
  #
  # This is the ONLY consumer of build-check's uploaded artifact. Its
  # `if:` predicate MUST stay in sync with the upload step's `if:` in
  # build-check — if you ever widen this trigger, widen that upload gate
  # too, or this job will try to download an artifact that was never
  # uploaded.
  page-smoke-crawler:
    name: Page Smoke Crawler
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-check
    if: startsWith(github.head_ref, 'preview/')

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          lfs: false

      - name: Setup pnpm
        uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: zfb-build-pr-${{ github.event.pull_request.number }}
          path: dist

      - name: Install serve
        run: pnpm add -g serve

      - name: Start production server
        run: |
          echo "Starting production server on port 8030..."
          serve dist -l 8030 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          # Wait for server to be ready
          echo "⏳ Waiting for server to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:8030/manuals/ > /dev/null; then
              echo "✅ Server is ready!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Server failed to start"
              exit 1
            fi
            sleep 1
          done

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests..."
          BASE_URL="http://localhost:8030" node scripts/test-all-pages-fast.js
          echo "✅ Smoke tests passed!"

      - name: Stop server
        if: always()
        run: |
          if [ ! -z "$SERVER_PID" ]; then
            kill $SERVER_PID || true
          fi

      - name: Comment page smoke crawler status
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            const emoji = success ? '✅' : '❌';
            const status = success ? 'passed' : 'failed';

            const body = `${emoji} **Page Smoke Crawler ${status}**

            HTTP-status crawl of every manual's pages against the production build (not a browser test).

            ${success ? '✅ Every manual page returned HTTP 200.' : '❌ Some pages failed to load. Check the logs for details.'}`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Page Smoke Crawler')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

  # Job 4: E2E Interaction Tests (Playwright) — runs on ALL PRs
  #
  # Runs the browser-level Playwright interaction specs (NOT the all-pages
  # crawler — page loads are covered by page-smoke-crawler and the main-e2e
  # workflow). This is the only CI path that would have caught the broken
  # navigation/scroll assertions that sat on main for ~5 months (#196).
  #
  # Builds the site IN-JOB via the build-zfb composite action and runs
  # Playwright with SKIP_ZFB_BUILD=1 against that build — deliberately NOT
  # consuming build-check's ~880 MB artifact (the workflow warns about the 2 GB
  # Actions storage cap). Chromium is cached on ~/.cache/ms-playwright keyed on
  # the installed Playwright version.
  #
  # No `branches:` filter exists on this workflow's pull_request trigger, so
  # this job fires for PRs targeting ANY base branch (e.g. topic/* base
  # branches), not just main. Do NOT add a branches filter without revisiting
  # this.
  e2e-interaction:
    name: E2E Interaction Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          lfs: false

      # Setup pnpm/node, install deps, and build dist/ — same composite action
      # the deploy paths use, so the e2e build can't drift from production.
      - name: Build zfb application
        uses: ./.github/actions/build-zfb
        with:
          node-version: '22'

      - name: Resolve Playwright version
        id: pw
        run: |
          PW_VERSION=$(node -e "console.log(require('@playwright/test/package.json').version)")
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Playwright version: $PW_VERSION"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      # Cache hit: only (re)install the OS-level deps (apt packages live outside
      # ~/.cache/ms-playwright and are never cached). Cache miss: download the
      # chromium browser plus its system deps.
      - name: Install Playwright chromium (+ system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cached browser)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Run ONLY the interaction specs against the already-built dist/ (Playwright
      # owns the serve via webServer + SKIP_ZFB_BUILD=1). all-pages.spec.ts is
      # intentionally excluded — page loads are the crawler's job.
      - name: Run Playwright interaction specs
        env:
          SKIP_ZFB_BUILD: '1'
        run: |
          echo "🎭 Running Playwright interaction specs..."
          npx playwright test \
            e2e/oxi-one-mk2-viewer.spec.ts \
            e2e/scroll-mode.spec.ts \
            e2e/language-toggle.spec.ts \
            e2e/viewer-ui.spec.ts
          echo "✅ Interaction specs passed"

      # On failure only: persist the on-retry traces (config uses the 'list'
      # reporter + trace:'on-first-retry', so there is no playwright-report/ dir;
      # failing tests drop a trace under test-results/). Tiny + 3-day retention
      # keeps this well clear of the 2 GB Actions storage cap.
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-traces-pr-${{ github.event.pull_request.number }}
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

  # Job 5: Preview Deploy (Cloudflare Pages) for same-repo PRs
  #
  # Builds the site itself via the build-zfb composite action rather than
  # downloading build-check's ~880 MB artifact. This removes the persisted
  # artifact from the preview path (the biggest Actions-storage lever) at the
  # cost of building the site twice per same-repo PR (once in build-check, once
  # here). A red build still blocks the deploy two ways: this job needs
  # quality-checks (typecheck/lint/format/unit), and its own build step runs
  # before the deploy step, so a broken build fails the job before deploying.
  preview-deploy:
    name: Preview Deploy (Cloudflare Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality-checks
    if: github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read
      pull-requests: write
      deployments: write
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          lfs: false

      - name: Build zfb application
        uses: ./.github/actions/build-zfb
        with:
          node-version: '22'

      - name: Deploy to Cloudflare Pages Preview
        id: deploy
        uses: ./.github/actions/deploy-cloudflare
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          branch: pr-${{ github.event.pull_request.number }}
          commit-hash: ${{ github.event.pull_request.head.sha }}
          commit-message: 'PR #${{ github.event.pull_request.number }} preview: ${{ github.event.pull_request.head.sha }}'
          build-dir: dist

      - name: Create deployment record
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.HEAD_SHA,
              environment: 'preview',
              description: 'PR preview deployment to Cloudflare Pages',
              production_environment: false,
              auto_merge: false,
              required_contexts: []
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: process.env.DEPLOY_URL,
              description: 'PR preview deployment successful'
            });

      - name: Log deploy URL
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy-url }}
        run: |
          echo "Deployed preview URL: $DEPLOY_URL"

      - name: Comment preview URL on PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy-url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const deployUrl = process.env.DEPLOY_URL;
            const prNumber = process.env.PR_NUMBER;
            const commitSha = process.env.COMMIT_SHA;
            const shortSha = commitSha.substring(0, 7);

            const body = [
              '<!-- cf-preview-pr -->',
              '**PR Preview Deployed**',
              '',
              `URL: ${deployUrl}`,
              `Full manual: ${deployUrl}/manuals/oxi-one-mk2/`,
              `Branch: \`pr-${prNumber}\``,
              `Commit: \`${shortSha}\``
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('<!-- cf-preview-pr -->')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Notify PR preview status
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy-url }}
          JOB_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const success = process.env.JOB_STATUS === 'success';
            const status = success ? 'success' : 'failure';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: status,
              target_url: process.env.DEPLOY_URL,
              description: success ? 'PR preview deployment successful' : 'PR preview deployment failed',
              context: 'cloudflare/pr-preview'
            });
