name: PR Quality Checks

# Runs on all pull requests
# - Basic quality checks (typecheck, lint, format) for all PRs
# - E2E smoke tests for PRs from preview/* branches
on:
  pull_request:
    types: [opened, synchronize, reopened]

# Prevent concurrent checks per PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Grant necessary permissions
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # Job 1: Code Quality Checks (runs for all PRs)
  quality-checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          lfs: false

      - name: Setup pnpm
        uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type checking
        run: |
          echo "🔍 Running TypeScript type checking..."
          pnpm run typecheck
          echo "✅ Type checking passed"

      - name: Run ESLint
        run: |
          echo "🔍 Running ESLint..."
          pnpm run lint
          echo "✅ Linting passed"

      - name: Run Prettier format check
        run: |
          echo "🔍 Running Prettier format check..."
          pnpm run format
          echo "✅ Format check passed"

      - name: Run unit tests
        run: |
          echo "Running unit tests..."
          pnpm run test:unit
          echo "Unit tests passed"

      - name: Comment quality check status
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            const emoji = success ? '✅' : '❌';
            const status = success ? 'passed' : 'failed';

            const body = `${emoji} **Code Quality Checks ${status}**

            - TypeScript: ${success ? '✅' : '❌'}
            - ESLint: ${success ? '✅' : '❌'}
            - Prettier: ${success ? '✅' : '❌'}
            - Unit Tests: ${success ? '✅' : '❌'}

            ${success ? '' : '⚠️ Please fix the issues above before merging.'}`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Code Quality Checks')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

  # Job 2: Build Check (runs for all PRs)
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          lfs: false

      - name: Setup pnpm
        uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build zfb site
        run: pnpm build
        env:
          NODE_ENV: production
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Verify build output
        run: |
          echo "Build Output Verification"
          echo "========================="

          if [ ! -d "dist" ]; then
            echo "Error: dist/ directory not found"
            exit 1
          fi

          # Count HTML files emitted by zfb + finalize
          HTML_COUNT=$(find dist -name "*.html" | wc -l)
          echo "HTML files: $HTML_COUNT"

          # zfb-finalize-build.js merges everything under dist/manuals/
          if [ -d "dist/manuals/assets" ]; then
            echo "zfb assets found (dist/manuals/assets/)"
          else
            echo "Error: dist/manuals/assets/ not found"
            exit 1
          fi

          # Cloudflare control files must be at dist/ root
          if [ -f "dist/_headers" ]; then
            echo "dist/_headers present"
          else
            echo "Error: dist/_headers not found at dist root"
            exit 1
          fi

          echo "========================="
          echo "Build output verified"

      - name: Upload build artifacts (for e2e tests)
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: zfb-build-pr-${{ github.event.pull_request.number }}
          path: dist/
          include-hidden-files: true
          retention-days: 1

  # Job 3: E2E Smoke Tests (only for preview/* branches)
  e2e-smoke-tests:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-check
    if: startsWith(github.head_ref, 'preview/')

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          lfs: false

      - name: Setup pnpm
        uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: zfb-build-pr-${{ github.event.pull_request.number }}
          path: dist

      - name: Install serve
        run: pnpm add -g serve

      - name: Start production server
        run: |
          echo "Starting production server on port 8030..."
          serve dist -l 8030 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          # Wait for server to be ready
          echo "⏳ Waiting for server to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:8030/manuals/ > /dev/null; then
              echo "✅ Server is ready!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Server failed to start"
              exit 1
            fi
            sleep 1
          done

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests..."
          BASE_URL="http://localhost:8030" node scripts/test-all-pages-fast.js
          echo "✅ Smoke tests passed!"

      - name: Stop server
        if: always()
        run: |
          if [ ! -z "$SERVER_PID" ]; then
            kill $SERVER_PID || true
          fi

      - name: Comment e2e test status
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            const emoji = success ? '✅' : '❌';
            const status = success ? 'passed' : 'failed';

            const body = `${emoji} **E2E Smoke Tests ${status}**

            Tested all manual pages against production build.

            ${success ? '✅ All pages loaded successfully with HTTP 200.' : '❌ Some pages failed to load. Check the logs for details.'}`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('E2E Smoke Tests')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

  # Job 4: Preview Deploy (Cloudflare Pages) for same-repo PRs
  preview-deploy:
    name: Preview Deploy (Cloudflare Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-check
    if: github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read
      pull-requests: write
      deployments: write
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          lfs: false

      - name: Download build artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: zfb-build-pr-${{ github.event.pull_request.number }}
          path: dist

      - name: Deploy to Cloudflare Pages Preview
        id: deploy
        uses: ./.github/actions/deploy-cloudflare
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          branch: pr-${{ github.event.pull_request.number }}
          commit-hash: ${{ github.event.pull_request.head.sha }}
          commit-message: 'PR #${{ github.event.pull_request.number }} preview: ${{ github.event.pull_request.head.sha }}'
          build-dir: dist

      - name: Create deployment record
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.HEAD_SHA,
              environment: 'preview',
              description: 'PR preview deployment to Cloudflare Pages',
              production_environment: false,
              auto_merge: false,
              required_contexts: []
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: process.env.DEPLOY_URL,
              description: 'PR preview deployment successful'
            });

      - name: Log deploy URL
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy-url }}
        run: |
          echo "Deployed preview URL: $DEPLOY_URL"

      - name: Comment preview URL on PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy-url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const deployUrl = process.env.DEPLOY_URL;
            const prNumber = process.env.PR_NUMBER;
            const commitSha = process.env.COMMIT_SHA;
            const shortSha = commitSha.substring(0, 7);

            const body = [
              '<!-- cf-preview-pr -->',
              '**PR Preview Deployed**',
              '',
              `URL: ${deployUrl}`,
              `Full manual: ${deployUrl}/manuals/oxi-one-mk2/`,
              `Branch: \`pr-${prNumber}\``,
              `Commit: \`${shortSha}\``
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('<!-- cf-preview-pr -->')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Notify PR preview status
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy-url }}
          JOB_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const success = process.env.JOB_STATUS === 'success';
            const status = success ? 'success' : 'failure';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: status,
              target_url: process.env.DEPLOY_URL,
              description: success ? 'PR preview deployment successful' : 'PR preview deployment failed',
              context: 'cloudflare/pr-preview'
            });
