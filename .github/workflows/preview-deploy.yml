name: Deploy preview/* to Cloudflare Pages Preview

# Triggers on pushes to any preview/* branch
# Builds Next.js and deploys to Cloudflare Pages preview
on:
  push:
    branches:
      - 'preview/*'

# Prevent concurrent deployments per branch
concurrency:
  group: preview-deploy-${{ github.ref }}
  cancel-in-progress: true

# Grant necessary permissions
permissions:
  contents: read
  issues: write
  pull-requests: write
  deployments: write
  statuses: write

jobs:
  deploy:
    name: Build and Deploy to Cloudflare Preview
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          lfs: false

      - name: Build zfb application
        uses: ./.github/actions/build-zfb
        with:
          node-version: '20'

      - name: Sanitize branch name
        id: branch
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          SANITIZED=$(echo "$BRANCH_NAME" | tr '/' '-')
          echo "sanitized=$SANITIZED" >> "$GITHUB_OUTPUT"
          echo "Branch: $BRANCH_NAME -> $SANITIZED"
        shell: bash

      - name: Deploy to Cloudflare Pages Preview
        id: deploy
        uses: ./.github/actions/deploy-cloudflare
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          branch: ${{ steps.branch.outputs.sanitized }}
          commit-hash: ${{ github.sha }}
          commit-message: 'Deploy preview branch - ${{ github.sha }}'
          build-dir: dist

      - name: Create deployment record
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy-url }}
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'preview',
              description: 'Preview deployment to Cloudflare Pages',
              production_environment: false,
              auto_merge: false,
              required_contexts: []
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: process.env.DEPLOY_URL,
              description: 'Preview deployment successful'
            });

      - name: Comment deployment URL on PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy-url }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const branch = process.env.BRANCH_NAME;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open'
            });

            if (prs.length > 0) {
              const body = [
                '<!-- cf-preview-branch -->',
                `**Preview Deployed**`,
                '',
                `URL: ${process.env.DEPLOY_URL}`,
                `Branch: \`${branch}\``,
                `Commit: \`${process.env.COMMIT_SHA}\``
              ].join('\n');

              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prs[0].number
              });

              const existing = comments.find(c =>
                c.user.type === 'Bot' && c.body.includes('<!-- cf-preview-branch -->')
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prs[0].number,
                  body
                });
              }
              console.log(`Posted deployment URL to PR #${prs[0].number}`);
            }

      - name: Notify deployment status
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy-url }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === 'success';
            const status = success ? 'success' : 'failure';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: status,
              target_url: process.env.DEPLOY_URL,
              description: success ? 'Preview deployment successful' : 'Preview deployment failed',
              context: 'cloudflare/preview'
            });
