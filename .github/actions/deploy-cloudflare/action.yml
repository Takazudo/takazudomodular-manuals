name: 'Deploy to Cloudflare Pages'
description: 'Deploy built site to Cloudflare Pages via wrangler CLI'

inputs:
  cloudflare-api-token:
    description: 'Cloudflare API token with Pages edit permission'
    required: true
  cloudflare-account-id:
    description: 'Cloudflare account ID'
    required: true
  project-name:
    description: 'Cloudflare Pages project name'
    required: false
    default: 'zmanuals'
  branch:
    description: 'Branch name for deployment (main = production)'
    required: false
    default: 'main'
  commit-hash:
    description: 'Git commit SHA for deployment metadata'
    required: false
    default: ''
  commit-message:
    description: 'Deployment message'
    required: false
    default: 'Deploy from GitHub Actions'
  build-dir:
    description: 'Directory containing build output'
    required: false
    default: 'out'

outputs:
  deploy-url:
    description: 'URL of the deployed site'
    value: ${{ steps.deploy.outputs.deploy-url }}

runs:
  using: 'composite'
  steps:
    - name: Install wrangler
      run: npm install -g wrangler@4
      shell: bash

    - name: Ensure Pages project exists
      run: |
        wrangler pages project list --json 2>/dev/null | grep -q '"${{ inputs.project-name }}"' || {
          echo "Creating Cloudflare Pages project: ${{ inputs.project-name }}"
          wrangler pages project create "${{ inputs.project-name }}" --production-branch=main
        }
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}

    - name: Deploy to Cloudflare Pages
      id: deploy
      run: |
        echo "Deploying to Cloudflare Pages (branch: ${{ inputs.branch }})..."

        DEPLOY_OUTPUT=$(wrangler pages deploy "${{ inputs.build-dir }}" \
          --project-name="${{ inputs.project-name }}" \
          --branch="${{ inputs.branch }}" \
          --commit-hash="${{ inputs.commit-hash }}" \
          --commit-message="${{ inputs.commit-message }}" \
          --commit-dirty=true 2>&1) || {
          echo "Deployment failed"
          echo "$DEPLOY_OUTPUT"
          exit 1
        }

        echo "$DEPLOY_OUTPUT"

        # Extract deployment URL from wrangler output
        DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oP 'https://[^ ]*\.pages\.dev' | tail -1)

        if [ -z "$DEPLOY_URL" ]; then
          echo "Warning: Could not parse deploy URL from output"
          # Construct expected URL
          if [ "${{ inputs.branch }}" = "main" ]; then
            DEPLOY_URL="https://${{ inputs.project-name }}.pages.dev"
          else
            SANITIZED_BRANCH=$(echo "${{ inputs.branch }}" | tr '/' '-')
            DEPLOY_URL="https://${SANITIZED_BRANCH}.${{ inputs.project-name }}.pages.dev"
          fi
        fi

        echo "deploy-url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        echo "Deployed to: $DEPLOY_URL"
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
