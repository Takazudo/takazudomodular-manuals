name: 'Build Next.js Application'
description: 'Setup environment, run quality checks, and build Next.js app'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '20'

outputs:
  build-output-path:
    description: 'Path to the build output directory'
    value: 'out'

runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4

    - name: Setup Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Run code quality checks
      run: |
        echo "🔍 Running code quality checks..."
        pnpm run typecheck
        pnpm run lint
        pnpm run format
        echo "✅ Code quality checks passed"
      shell: bash

    - name: Cache Next.js build
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .next/cache
        key: nextjs-cache-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'next.config.js', 'tsconfig.json') }}
        restore-keys: nextjs-cache-v1-${{ runner.os }}-

    - name: Build Next.js
      run: pnpm build
      shell: bash
      env:
        NODE_ENV: production
        NODE_OPTIONS: '--max-old-space-size=4096'

    - name: Verify build output
      run: |
        echo "📦 Build Output Verification"
        echo "============================"

        if [ ! -d "out" ]; then
          echo "❌ Error: out/ directory not found"
          exit 1
        fi

        # Count output files
        HTML_COUNT=$(find out -name "*.html" | wc -l)
        echo "📄 HTML files: $HTML_COUNT"

        # With basePath: '/manuals', assets are under out/manuals/_next/
        if [ -d "out/manuals/_next" ]; then
          echo "✅ Next.js static assets found (under manuals/)"
        else
          echo "❌ Error: manuals/_next/ directory not found"
          exit 1
        fi

        echo "============================"
        echo "✅ Build output verified"
      shell: bash
